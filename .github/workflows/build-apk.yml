name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Java environment
        run: |
          echo "=== Verifying Java environment ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

          JAVA_VERSION_OUTPUT=$(java -version 2>&1)
          RAW_VERSION=$(echo "$JAVA_VERSION_OUTPUT" | head -n 1 | sed -E 's/.*version "([^"]+)".*/\1/')
          if [ -z "$RAW_VERSION" ]; then
            echo "::error::Failed to detect Java version"
            exit 1
          fi
          echo "Detected Java version string: $RAW_VERSION"

          MAJOR_VERSION=$(echo "$RAW_VERSION" | cut -d'.' -f1)
          if [ "$MAJOR_VERSION" = "1" ]; then
            MAJOR_VERSION=$(echo "$RAW_VERSION" | cut -d'.' -f2)
          fi
          echo "Active Java major version: $MAJOR_VERSION"

          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse a numeric Java major version from '$RAW_VERSION'"
            exit 1
          fi

          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java major version is $MAJOR_VERSION, which is lower than required 17"
            exit 1
          fi
          echo "Java version verification passed: $MAJOR_VERSION >= 17"

      - name: Accept Android SDK licenses
        run: |
          echo "=== Accepting Android SDK licenses ==="
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Checking debug keystore ==="
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists in repository root."
          else
            echo "Generating temporary debug.keystore with keytool..."
            keytool -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::./debug.keystore could not be created or found."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true"
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at: $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is not a regular file"
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is empty"
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "::error::$EXPECTED_APK does not have the .apk extension"
              exit 1
              ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::Selected APK is not exactly app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

          echo "Debug APK verified successfully at $EXPECTED_APK"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          REPO_RAW="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO=$(echo "$REPO_RAW" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9_-]/-/g' -e 's/-\+/-/g' -e 's/^-//' -e 's/-$//')
          if [ -z "$SAFE_REPO" ]; then
            SAFE_REPO="android-app"
          fi

          ASSET_FILENAME="${SAFE_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TEMP_ASSET_DIR="${RUNNER_TEMP}/release_asset"
          mkdir -p "$TEMP_ASSET_DIR"
          ASSET_PATH="${TEMP_ASSET_DIR}/${ASSET_FILENAME}"

          cp "$SRC_APK" "$ASSET_PATH"

          echo "Prepared release asset: $ASSET_PATH"
          echo "Asset filename: $ASSET_FILENAME"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_filename=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "=== Verifying GitHub CLI ==="
          if ! command -v gh &> /dev/null; then
            echo "::error::GitHub CLI (gh) is not available"
            exit 1
          fi
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ]; then
            echo "::error::Release asset not found at '$ASSET_PATH'"
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset is empty: '$ASSET_PATH'"
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::error::Release asset does not have .apk extension: '$ASSET_PATH'"
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${RUN_NUMBER}-${RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${RUN_NUMBER}"

          echo "Target Release Tag: $RELEASE_TAG"
          echo "Target Release Title: $RELEASE_TITLE"
          echo "Target Commit SHA: $COMMIT_SHA"

          NOTES_PATH="${RUNNER_TEMP}/release_notes.md"
          {
            echo "### Debug APK Build Information"
            echo "- This is an automatically generated debug APK."
            echo "- The APK was built by GitHub Actions."
            echo "- GitHub Actions run number: ${RUN_NUMBER}"
            echo "- GitHub Actions run attempt: ${RUN_ATTEMPT}"
            echo "- Source commit SHA: ${COMMIT_SHA}"
            echo "- The APK is intended for testing."
            echo "- The APK is not a Play Store production release."
            echo "- The APK is signed only with a temporary debug keystore."
          } > "$NOTES_PATH"

          gh release create "$RELEASE_TAG" \
            "$ASSET_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_PATH" \
            --target "$COMMIT_SHA" \
            --latest

      - name: Report APK download result
        id: report_result
        if: always() && steps.prepare_asset.conclusion == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set +e
          RELEASE_TAG="debug-apk-build-${RUN_NUMBER}-${RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${RUN_NUMBER}"
          ASSET_FILENAME="${{ steps.prepare_asset.outputs.asset_filename }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
          DIRECT_DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${ASSET_FILENAME}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== GitHub Release publishing succeeded ==="
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "Direct APK Download URL: $DIRECT_DOWNLOAD_URL"
            echo "APK Asset Filename: $ASSET_FILENAME"

            {
              echo "## 🚀 Debug APK Build & Release Summary"
              echo ""
              echo "- **Release Title**: $RELEASE_TITLE"
              echo "- **Release Tag**: \`$RELEASE_TAG\`"
              echo "- **Release Page URL**: [$RELEASE_URL]($RELEASE_URL)"
              echo "- **Direct APK Asset**: [$ASSET_FILENAME]($DIRECT_DOWNLOAD_URL)"
              echo ""
              echo "The debug APK can be downloaded directly to your phone from the [GitHub Release page]($RELEASE_URL) or using the [direct APK link]($DIRECT_DOWNLOAD_URL)."
              echo ""
              echo "> **Actions Artifact Backup**: The standard Actions artifact named \`app-debug-apk\` is also available on this workflow run page."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not complete, but the debug APK build succeeded."
            echo "APK build succeeded: app/build/outputs/apk/debug/app-debug.apk"
            echo "The Actions artifact named app-debug-apk remains available."

            {
              echo "## ⚠️ Debug APK Build Notice"
              echo ""
              echo "**Status:** The debug APK build succeeded, but publishing to GitHub Releases did not complete."
              echo ""
              echo "**Download Location:**"
              echo "The compiled debug APK is preserved and available for download under the workflow run's **Artifacts** section as **\`app-debug-apk\`**."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
